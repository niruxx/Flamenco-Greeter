  <circle cx="40" cy="40" r="18" fill="#e98aa8"/>
  <text x="40" y="46" text-anchor="middle" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#140f10">3</text>
