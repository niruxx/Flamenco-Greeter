  <text x="70" y="47" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#f5e9e7">greetd</text>
  <text x="24" y="88" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#b9a3a2">starts flamenco-greeter</text>
  <text x="24" y="110" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#b9a3a2">as the greeter user</text>
</g>
<path d="M278 66.0 h24 m-8 -7 l8 7 l-8 7" fill="none" stroke="#b9a3a2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
