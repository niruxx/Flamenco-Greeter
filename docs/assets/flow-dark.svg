  <text x="70" y="47" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#f5e9e7">Launcher</text>
  <text x="24" y="88" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#b9a3a2">loads your synced theme,</text>
  <text x="24" y="110" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#b9a3a2">keyboard and cursor</text>
