<svg xmlns="http://www.w3.org/2000/svg" width="1218" height="132" viewBox="0 0 1218 132" role="img" aria-label="How a login works: greetd, the launcher, niri, your desktop">
<title>How a login works: greetd, the launcher, niri, your desktop</title>
<defs>
