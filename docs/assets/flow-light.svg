<svg xmlns="http://www.w3.org/2000/svg" width="1218" height="132" viewBox="0 0 1218 132" role="img" aria-label="How a login works: greetd, the launcher, niri, your desktop">
<title>How a login works: greetd, the launcher, niri, your desktop</title>
<defs>
  <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d0304d"/><stop offset="1" stop-color="#b8740f"/>
  </linearGradient>
  <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#d0304d" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#d0304d" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#b8740f" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#b8740f" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#a8456a" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#a8456a" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.12"/></filter>
  
</defs>
<g transform="translate(0 0)">
  <rect x=".5" y=".5" width="269" height="131" rx="24" fill="#ffffff" stroke="#ddc6c2"/>
  <circle cx="40" cy="40" r="18" fill="#d0304d"/>
  <text x="40" y="46" text-anchor="middle" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">1</text>
  <text x="70" y="47" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#2b1b1c">greetd</text>
  <text x="24" y="88" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7b6564">starts flamenco-greeter</text>
  <text x="24" y="110" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7b6564">as the greeter user</text>
</g>
<path d="M278 66.0 h24 m-8 -7 l8 7 l-8 7" fill="none" stroke="#7b6564" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(316 0)">
  <rect x=".5" y=".5" width="269" height="131" rx="24" fill="#ffffff" stroke="#ddc6c2"/>
  <circle cx="40" cy="40" r="18" fill="#b8740f"/>
  <text x="40" y="46" text-anchor="middle" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#fbf3f1">2</text>
  <text x="70" y="47" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#2b1b1c">Launcher</text>
  <text x="24" y="88" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7b6564">loads your synced theme,</text>
  <text x="24" y="110" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7b6564">keyboard and cursor</text>
</g>
<path d="M594 66.0 h24 m-8 -7 l8 7 l-8 7" fill="none" stroke="#7b6564" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(632 0)">
  <rect x=".5" y=".5" width="269" height="131" rx="24" fill="#ffffff" stroke="#ddc6c2"/>
  <circle cx="40" cy="40" r="18" fill="#a8456a"/>
  <text x="40" y="46" text-anchor="middle" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#fbf3f1">3</text>
  <text x="70" y="47" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#2b1b1c">niri</text>
  <text x="24" y="88" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7b6564">a minimal session that</text>
  <text x="24" y="110" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7b6564">runs the Quickshell UI</text>
</g>
<path d="M910 66.0 h24 m-8 -7 l8 7 l-8 7" fill="none" stroke="#7b6564" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(948 0)">
  <rect x=".5" y=".5" width="269" height="131" rx="24" fill="#ffffff" stroke="#ddc6c2"/>
  <circle cx="40" cy="40" r="18" fill="#d0304d"/>
  <text x="40" y="46" text-anchor="middle" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">4</text>
  <text x="70" y="47" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#2b1b1c">Your desktop</text>
  <text x="24" y="88" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7b6564">greetd launches the</text>
  <text x="24" y="110" font-family="Inter, 'Google Sans', Roboto, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7b6564">session you picked</text>
