# /etc/greetd/config.toml  (or let `flamenco-greeter enable` write it)
[terminal]
vt = 1

[default_session]
user = "greeter"
command = "/usr/bin/flamenco-greeter --command niri"
# Hyprland:  command = "/usr/bin/flamenco-greeter --command hyprland"
# Sway:      command = "/usr/bin/flamenco-greeter --command sway"
